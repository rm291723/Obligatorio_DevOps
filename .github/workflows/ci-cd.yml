name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 220951639094
  ECR_REGISTRY: 220951639094.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [admin, cart, catalog, checkout, orders, ui]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/retailstore/${{ matrix.service }}:${{ github.sha }} \
            src/${{ matrix.service }}

      - name: Push to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/retailstore/${{ matrix.service }}:${{ github.sha }}
          docker tag ${{ env.ECR_REGISTRY }}/retailstore/${{ matrix.service }}:${{ github.sha }} \
            ${{ env.ECR_REGISTRY }}/retailstore/${{ matrix.service }}:latest
          docker push ${{ env.ECR_REGISTRY }}/retailstore/${{ matrix.service }}:latest