name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 220951639094
  ECR_REGISTRY: 220951639094.dkr.ecr.us-east-1.amazonaws.com

jobs:
  gitleaks:
    name: Detect Secrets with Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: SAST with Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/golang
            p/python
            p/typescript

  sonarcloud:
    name: Code Quality with SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/*.test.*,**/dist/**        
  
  newman-tests:
    name: API Tests with Newman
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Newman
        run: npm install -g newman

      - name: Start services with Docker Compose
        run: |
          docker compose up -d
          sleep 60

      - name: Run Newman tests
        run: newman run tests/retailstore.collection.json --reporters cli,junit --reporter-junit-export results/newman-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-results
          path: results/newman-results.xml

      - name: Stop services
        if: always()
        run: docker compose down    

  terraform-sast:
    name: Terraform Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Check Format & Validate
        run: |
          for env in dev test prod; do
            cd ${GITHUB_WORKSPACE}/terraform/environments/$env
            terraform init -backend=false
            terraform validate
          done

  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep, sonarcloud, newman-tests, terraform-sast]

    strategy:
      matrix:
        service: [admin, cart, catalog, checkout, orders, ui]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if not exists
        run: |
          aws ecr describe-repositories \
            --repository-names retailstore/${{ matrix.service }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name retailstore/${{ matrix.service }} \
            --region ${{ env.AWS_REGION }}

      - name: Build Docker image
        run: |
          docker build -t retailstore/${{ matrix.service }}:${{ github.sha }} \
            src/${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: retailstore/${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Push to ECR
        run: |
          docker tag retailstore/${{ matrix.service }}:${{ github.sha }} ${{ env.ECR_REGISTRY }}/retailstore/${{ matrix.service }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/retailstore/${{ matrix.service }}:${{ github.sha }}
          docker tag retailstore/${{ matrix.service }}:${{ github.sha }} ${{ env.ECR_REGISTRY }}/retailstore/${{ matrix.service }}:latest
          docker push ${{ env.ECR_REGISTRY }}/retailstore/${{ matrix.service }}:latest

  terraform-plan:
    name: Terraform Plan (PR Review)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Plan Environments
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          TARGET_ENV="dev"
          if [ "$GITHUB_BASE_REF" = "main" ]; then TARGET_ENV="prod"; fi
          
          cd terraform/environments/$TARGET_ENV
          terraform init
          terraform plan -no-color || true

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Deploy Dev
        working-directory: terraform/environments/dev
        run: |
          terraform init
          for service in admin cart catalog checkout orders ui; do
            terraform import "module.ecr.aws_ecr_repository.this[\"$service\"]" retailstore/$service 2>/dev/null || true
          done
          terraform apply -auto-approve

  deploy-test:
    name: Deploy to Test
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Deploy Test
        working-directory: terraform/environments/test
        run: |
          terraform init
          for service in admin cart catalog checkout orders ui; do
            terraform import "module.ecr.aws_ecr_repository.this[\"$service\"]" retailstore/$service 2>/dev/null || true
          done
          terraform apply -auto-approve

  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Deploy Prod
        working-directory: terraform/environments/prod
        run: |
          terraform init
          for service in admin cart catalog checkout orders ui; do
            terraform import "module.ecr.aws_ecr_repository.this[\"$service\"]" retailstore/$service 2>/dev/null || true
          done
          terraform apply -auto-approve